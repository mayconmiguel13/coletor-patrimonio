name: Build APK Coletor de Patrimonio

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Limpar diretório android anterior
        run: rm -rf android

      - name: Gerar estrutura nativa Android completa
        run: |
          flutter create . --platforms=android --org com.coletor --project-name coletor_patrimonio
          rm -rf test

      - name: Configurar Permissões e SDK via Python
        run: |
          python3 - << 'EOF'
          import glob

          # 1. Permissões no AndroidManifest.xml
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = f.read()

          perms = """
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
          """

          if "<application" in manifest:
              manifest = manifest.replace("<application", perms + "\n    <application", 1)
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(manifest)
              print("AndroidManifest.xml atualizado com permissões.")

          # 2. Ajustar compileSdk 35 e minSdk 21
          for path in glob.glob("android/app/build.gradle*"):
              with open(path, "r", encoding="utf-8") as f:
                  bg = f.read()
              bg = bg.replace("flutter.minSdkVersion", "21")
              bg = bg.replace("flutter.compileSdkVersion", "35")
              bg = bg.replace("compileSdkVersion 34", "compileSdkVersion 35")
              bg = bg.replace("minSdkVersion 16", "minSdkVersion 21")
              bg = bg.replace("minSdkVersion 19", "minSdkVersion 21")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(bg)
              print(f"SDK ajustado em {path}.")
          EOF

      - name: Baixar Dependências
        run: flutter pub get

      - name: Analisar Código Dart
        run: flutter analyze || true

      - name: Compilar APK de Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Disponibilizar APK para Download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: coletor-patrimonio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
