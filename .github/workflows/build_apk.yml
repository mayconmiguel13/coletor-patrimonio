name: Build APK Coletor de Patrimonio

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Limpar diretório android anterior
        run: rm -rf android

      - name: Gerar estrutura nativa Android completa
        run: flutter create . --platforms=android --org com.coletor --project-name coletor_patrimonio

      - name: Configurar Permissões no AndroidManifest.xml
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />' android/app/src/main/AndroidManifest.xml

      - name: Ajustar minSdkVersion para 21
        run: |
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' {} + || true
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' {} + || true
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/minSdkVersion 16/minSdkVersion 21/g' {} + || true
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/minSdkVersion 19/minSdkVersion 21/g' {} + || true

      - name: Baixar Dependências
        run: flutter pub get

      - name: Compilar APK de Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Disponibilizar APK para Download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: coletor-patrimonio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
