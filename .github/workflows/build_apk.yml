name: Build APK Coletor de Patrimonio

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Limpar diretório android anterior
        run: rm -rf android

      - name: Gerar estrutura nativa Android completa
        run: |
          flutter create . --platforms=android --org com.coletor --project-name coletor_patrimonio
          rm -rf test

      - name: Configurar Permissões, ProGuard e SDK
        run: python3 scripts/configure_android.py

      - name: Baixar Dependências
        run: flutter pub get

      - name: Analisar Código Dart
        run: flutter analyze || true

      - name: Compilar APK de Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Disponibilizar APK para Download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: coletor-patrimonio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar Release Direta do APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Versão Atualizada (APK Direto)"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
